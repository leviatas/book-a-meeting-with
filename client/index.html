<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book a Meeting</title>
    <script>
      // Aplica el tema guardado (o el del sistema) antes de que React monte,
      // así se evita el flash de tema incorrecto en el primer paint. La
      // preferencia real puede vivir en la cuenta; esto es sólo una copia
      // local para pintar rápido.
      (function () {
        try {
          var pref = localStorage.getItem('bookameeting_theme') || 'SYSTEM';
          var dark =
            pref === 'DARK' ||
            (pref === 'SYSTEM' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
